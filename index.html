<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Airport Departure Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Airport Departure Board</h1>

    <div class="top-bar">
        <div id="clock">00:00:00</div>
        <div id="summary"></div>
    </div>

    <div class="buttons">
        <button id="addBtn">Add Departure</button>
        <button id="resetBtn">Reset</button>
    </div>

    <!-- Empty board -->
    <div class="board" id="board"></div>

    <script src="script.js"></script>

</body>

</html>
